# Profil test: URL/host diisi IntegrationTest dari Testcontainers.
senyap:
  outbox:
    poll-interval: 200ms
  db:
    bootstrap:
      enabled: true
      username: senyap_admin
      password: senyap_admin
  auth:
    phone-pepper: test-pepper-hanya-untuk-integration-test-0001
    ephemeral-signing-key: true
    otp:
      mock-code: "000000"
      # Semua request IT datang dari 127.0.0.1; batas per IP diuji lewat RateLimiter langsung.
      per-ip-per-hour: 100000
      verify-per-ip-per-hour: 100000
    datasource:
      password: test_auth_pw
  identity:
    purge-interval: 1s
    datasource:
      password: test_identity_pw
  media:
    gallery-per-category: 2
    sweep-interval: 2s
    stale-processing-after: 5s
    s3:
      create-bucket: true
    datasource:
      password: test_media_pw
  posts:
    datasource:
      password: test_posts_pw
  chat:
    request-expiry:
      initial-delay: 1s
      interval: 1s
    datasource:
      password: test_chat_pw
  notifications:
    datasource:
      password: test_notifications_pw
  safety:
    datasource:
      password: test_safety_pw
