# Konfigurasi dasar. Profil: local (dev), test, api (HTTP publik), worker (relay + job).
spring:
  application:
    name: senyap-api
  profiles:
    # `./mvnw -pl api spring-boot:run` tanpa argumen = lokal, API + worker dalam satu proses.
    default: local,api,worker
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Tiap modul punya DataSource + Flyway sendiri (M1, M7), jadi auto-config tunggal dimatikan.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  data:
    redis:
      host: ${SENYAP_REDIS_HOST:localhost}
      port: ${SENYAP_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SENYAP_KAFKA_BOOTSTRAP:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SENYAP_API_PORT:8180}
  shutdown: graceful
  # Di belakang load balancer: `native` (X-Forwarded-For dari LB tepercaya) supaya rate limit per IP benar.
  forward-headers-strategy: ${SENYAP_FORWARD_HEADERS:none}
  error:
    whitelabel:
      enabled: false

management:
  # Observability (Fase 5). Metrik: /actuator/prometheus (di k8s lewat port management terpisah,
  # MANAGEMENT_SERVER_PORT, tidak lewat ingress publik). Trace: OTLP ke collector bila SENYAP_OTLP_ENABLED=true.
  tracing:
    sampling:
      probability: ${SENYAP_TRACE_SAMPLING:1.0}
    export:
      otlp:
        enabled: ${SENYAP_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${SENYAP_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

senyap:
  api:
    enabled: false
  worker:
    enabled: false
  db:
    bootstrap:
      enabled: false
  security:
    # Kosong = verifikasi JWT memakai JWKS penerbit di proses ini (modul auth). Isi dengan URL
    # /.well-known/jwks.json bila modul ini dijalankan terpisah dari auth (aturan M12).
    jwks-uri: ${SENYAP_JWKS_URI:}
  auth:
    # Rahasia dari env/KMS. Tanpa keduanya aplikasi gagal start (kecuali profil local/test).
    phone-pepper: ${SENYAP_AUTH_PHONE_PEPPER:}
    signing-jwk: ${SENYAP_AUTH_SIGNING_JWK:}
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_auth
      password: ${SENYAP_DB_AUTH_PASSWORD:}
  identity:
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_identity
      password: ${SENYAP_DB_IDENTITY_PASSWORD:}
  media:
    # URL dasar objek publik (public/…); produksi = CDN. Lokal: bucket MinIO dengan policy baca publik untuk public/*.
    public-base-url: ${SENYAP_MEDIA_PUBLIC_URL:http://localhost:9000/media}
    # Placeholder generatif untuk galeri bawaan (aset final belum ada). Matikan setelah aset final diimpor.
    gallery-seed: ${SENYAP_MEDIA_GALLERY_SEED:true}
    gallery-per-category: 300
    s3:
      endpoint: ${SENYAP_S3_ENDPOINT:http://localhost:9000}
      region: ${SENYAP_S3_REGION:us-east-1}
      access-key: ${SENYAP_S3_ACCESS_KEY:senyap}
      secret-key: ${SENYAP_S3_SECRET_KEY:senyap-minio}
      bucket: ${SENYAP_S3_BUCKET:media}
      path-style: true
      create-bucket: false
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_media
      password: ${SENYAP_DB_MEDIA_PASSWORD:}
  posts:
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_posts
      password: ${SENYAP_DB_POSTS_PASSWORD:}
  chat:
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_chat
      password: ${SENYAP_DB_CHAT_PASSWORD:}
  notifications:
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_notifications
      password: ${SENYAP_DB_NOTIFICATIONS_PASSWORD:}
  safety:
    # Rahasia account_ref per kasus di konsol moderator. Kosong = acak per proses (ref berubah setelah restart).
    account-ref-secret: ${SENYAP_SAFETY_ACCOUNT_REF_SECRET:}
    # Daftar hash gambar terlarang. Di repo kosong; produksi: file di luar repo (lihat docs/05-prosedur-eskalasi-p0.md).
    image-hash-file: ${SENYAP_SAFETY_IMAGE_HASH_FILE:classpath:safety/known-image-hashes.txt}
    support:
      # PERLU DICEK SEBELUM RILIS. Nomor hotline Indonesia BELUM diverifikasi (pertanyaan terbuka di PROGRESS.md).
      # Di luar profil local/test aplikasi gagal start sampai hotline diisi dari sumber resmi dan verified=true.
      verified: false
      title: Kamu tidak sendirian
      message: >-
        Sepertinya kamu sedang melewati masa yang berat. Kamu berhak mendapat dukungan. Bicara dengan orang
        yang kamu percaya atau layanan di bawah ini bisa membantu. Kalau kamu dalam bahaya sekarang, hubungi
        layanan darurat terdekat.
      hotlines:
        - name: "[PERLU DIISI] Layanan konseling krisis / kesehatan jiwa"
          contact: BELUM-DIVERIFIKASI
          hours: "[PERLU DICEK]"
    datasource:
      url: ${SENYAP_DB_URL:jdbc:postgresql://localhost:5432/senyap}
      username: senyap_safety
      password: ${SENYAP_DB_SAFETY_PASSWORD:}
