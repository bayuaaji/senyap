# Collector lokal: OTLP (api, worker, realtime) → Tempo. Produksi: collector di namespace observability
# dengan exporter ke backend trace pilihan (Tempo/Grafana Cloud/Honeycomb …).
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}
processors:
  batch: {}
  # Pertahanan berlapis: buang atribut yang tidak boleh ada di trace (isi pesan, token, nomor HP).
  attributes/scrub:
    actions:
      - {key: http.request.header.authorization, action: delete}
      - {key: url.query, action: delete}
      - {key: senyap.body, action: delete}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlp/tempo]
