apiVersion: v1
kind: Namespace
metadata:
  name: senyap
---
# Env non-rahasia, sama untuk api/worker/realtime. Nilai per lingkungan di-patch overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: senyap-config
data:
  SENYAP_DB_URL: "jdbc:postgresql://postgres.example.internal:5432/senyap?sslmode=require"
  SENYAP_KAFKA_BOOTSTRAP: "kafka.example.internal:9092"
  SPRING_DATA_REDIS_CLUSTER_NODES: "redis.example.internal:6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"
  SENYAP_S3_ENDPOINT: "https://ACCOUNT_ID.r2.cloudflarestorage.com"
  SENYAP_S3_REGION: "auto"
  SENYAP_S3_BUCKET: "senyap-media"
  SENYAP_MEDIA_PUBLIC_URL: "https://cdn.senyap.app"
  SENYAP_MEDIA_GALLERY_SEED: "false"
  SENYAP_FORWARD_HEADERS: "native"
  SENYAP_JWKS_URI: "http://senyap-api.senyap.svc.cluster.local/.well-known/jwks.json"
  SENYAP_API_URL: "http://senyap-api.senyap.svc.cluster.local"
  MANAGEMENT_SERVER_PORT: "9464"
  SENYAP_OTLP_ENABLED: "true"
  SENYAP_OTLP_TRACES_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
  SENYAP_TRACE_SAMPLING: "0.1"
  SENYAP_RT_DRAIN_SPREAD: "10s"
  SENYAP_RT_DRAIN_TIMEOUT: "15s"
